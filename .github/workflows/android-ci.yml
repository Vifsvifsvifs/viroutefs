name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare debug APK artifact
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/ViRouteFS-debug-0.4.1-alpha.apk"
          FALLBACK_APK="app/build/outputs/apk/debug/app-debug.apk"
          ARTIFACT_APK="ViRouteFS-debug-0.4.1-alpha.apk"

          if [ -f "$EXPECTED_APK" ]; then
            cp "$EXPECTED_APK" "$ARTIFACT_APK"
          elif [ -f "$FALLBACK_APK" ]; then
            cp "$FALLBACK_APK" "$ARTIFACT_APK"
          else
            echo "No debug APK found. Expected $EXPECTED_APK or fallback $FALLBACK_APK." >&2
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print >&2 || true
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ViRouteFS-debug-0.4.1-alpha
          path: ViRouteFS-debug-0.4.1-alpha.apk
          if-no-files-found: error

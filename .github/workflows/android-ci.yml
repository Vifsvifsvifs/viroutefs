name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare optional alpha signing key
        env:
          VIROUTEFS_ALPHA_KEYSTORE_BASE64: ${{ secrets.VIROUTEFS_ALPHA_KEYSTORE_BASE64 }}
          VIROUTEFS_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.VIROUTEFS_ALPHA_KEYSTORE_PASSWORD }}
          VIROUTEFS_ALPHA_KEY_ALIAS: ${{ secrets.VIROUTEFS_ALPHA_KEY_ALIAS }}
          VIROUTEFS_ALPHA_KEY_PASSWORD: ${{ secrets.VIROUTEFS_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${VIROUTEFS_ALPHA_KEYSTORE_BASE64:-}" ]; then
            ALPHA_KEYSTORE_PATH="$RUNNER_TEMP/viroutefs-alpha.jks"
            printf '%s' "$VIROUTEFS_ALPHA_KEYSTORE_BASE64" | base64 --decode > "$ALPHA_KEYSTORE_PATH"
            {
              echo "VIROUTEFS_ALPHA_KEYSTORE_PATH=$ALPHA_KEYSTORE_PATH"
              echo "VIROUTEFS_ALPHA_KEYSTORE_PASSWORD=$VIROUTEFS_ALPHA_KEYSTORE_PASSWORD"
              echo "VIROUTEFS_ALPHA_KEY_ALIAS=$VIROUTEFS_ALPHA_KEY_ALIAS"
              echo "VIROUTEFS_ALPHA_KEY_PASSWORD=$VIROUTEFS_ALPHA_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Alpha signing key decoded into RUNNER_TEMP."
          else
            echo "VIROUTEFS_ALPHA_KEYSTORE_BASE64 is not configured; building with default debug signing."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare debug APK artifact
        run: |
          set -euo pipefail

          VERSION_NAME="$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/ { print $2; exit }' app/build.gradle.kts)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to detect versionName from app/build.gradle.kts." >&2
            exit 1
          fi

          mapfile -t DEBUG_APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#DEBUG_APKS[@]}" -eq 0 ]; then
            echo "No debug APK found under app/build/outputs/apk/debug/*.apk." >&2
            echo "Debug APK output directory contents:" >&2
            find app/build/outputs/apk/debug -maxdepth 2 -print >&2 || true
            exit 1
          fi

          SELECTED_APK="${DEBUG_APKS[0]}"
          ARTIFACT_NAME="ViRouteFS-debug-${VERSION_NAME}"
          ARTIFACT_APK="${ARTIFACT_NAME}.apk"

          echo "Detected VERSION_NAME: ${VERSION_NAME}"
          echo "Selected APK path: ${SELECTED_APK}"
          echo "Final artifact filename: ${ARTIFACT_APK}"

          cp "$SELECTED_APK" "$ARTIFACT_APK"
          {
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            echo "ARTIFACT_APK=${ARTIFACT_APK}"
          } >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_APK }}
          if-no-files-found: error

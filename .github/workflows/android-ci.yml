name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.12.0-beta.3'
        required: true
        type: string
      release_name:
        description: 'Release title, for example ViRouteFS 0.12.0-beta.3'
        required: true
        type: string
      prerelease:
        description: 'Mark this GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.prepare_apk.outputs.version_name }}
      version_code: ${{ steps.prepare_apk.outputs.version_code }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Prepare release signing key
        env:
          VIROUTEFS_ALPHA_KEYSTORE_BASE64: ${{ secrets.VIROUTEFS_ALPHA_KEYSTORE_BASE64 }}
          VIROUTEFS_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.VIROUTEFS_ALPHA_KEYSTORE_PASSWORD }}
          VIROUTEFS_ALPHA_KEY_ALIAS: ${{ secrets.VIROUTEFS_ALPHA_KEY_ALIAS }}
          VIROUTEFS_ALPHA_KEY_PASSWORD: ${{ secrets.VIROUTEFS_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${VIROUTEFS_ALPHA_KEYSTORE_BASE64:-}" ]; then
            RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/viroutefs-beta.jks"
            printf '%s' "$VIROUTEFS_ALPHA_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
            {
              echo "VIROUTEFS_ALPHA_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH"
              echo "VIROUTEFS_ALPHA_KEYSTORE_PASSWORD=$VIROUTEFS_ALPHA_KEYSTORE_PASSWORD"
              echo "VIROUTEFS_ALPHA_KEY_ALIAS=$VIROUTEFS_ALPHA_KEY_ALIAS"
              echo "VIROUTEFS_ALPHA_KEY_PASSWORD=$VIROUTEFS_ALPHA_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Beta signing key decoded into RUNNER_TEMP."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "A manual release requires VIROUTEFS_ALPHA_KEYSTORE_* repository secrets." >&2
            exit 1
          else
            echo "VIROUTEFS_ALPHA_KEYSTORE_BASE64 is not configured; building with default debug signing."
          fi

      - name: Run tests and build APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          else
            ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
          fi

      - name: Prepare APK artifact
        id: prepare_apk
        run: |
          set -euo pipefail

          VERSION_NAME="$(./gradlew -q :app:printVersionName | tail -n 1)"
          VERSION_CODE="$(./gradlew -q :app:printVersionCode | tail -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to obtain versionName from Gradle." >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APK_DIRECTORY="app/build/outputs/apk/release"
            BUILD_KIND="release"
          else
            APK_DIRECTORY="app/build/outputs/apk/debug"
            BUILD_KIND="debug"
          fi

          mapfile -t APKS < <(find "$APK_DIRECTORY" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK found under $APK_DIRECTORY." >&2
            find "$APK_DIRECTORY" -maxdepth 2 -print >&2 || true
            exit 1
          fi

          SELECTED_APK="${APKS[0]}"
          ARTIFACT_NAME="ViRouteFS-${BUILD_KIND}-${VERSION_NAME}"
          ARTIFACT_APK="${ARTIFACT_NAME}.apk"
          RELEASE_APK="ViRouteFS-${VERSION_NAME}.apk"

          echo "Detected VERSION_NAME: ${VERSION_NAME}"
          echo "Selected APK path: ${SELECTED_APK}"
          echo "CI artifact filename: ${ARTIFACT_APK}"
          echo "Release asset filename: ${RELEASE_APK}"

          cp "$SELECTED_APK" "$ARTIFACT_APK"
          cp "$SELECTED_APK" "$RELEASE_APK"
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            echo "ARTIFACT_APK=${ARTIFACT_APK}"
            echo "RELEASE_APK=${RELEASE_APK}"
          } >> "$GITHUB_ENV"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_APK }}
          if-no-files-found: error

      - name: Upload release APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ViRouteFS-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ViRouteFS-release-apk
          path: release-apk

      - name: Prepare release notes
        run: |
          set -euo pipefail

          VERSION_NAME="${{ needs.build.outputs.version_name }}"
          VERSION_CODE="${{ needs.build.outputs.version_code }}"
          RELEASE_APK="ViRouteFS-${VERSION_NAME}.apk"

          if [ ! -f "release-apk/${RELEASE_APK}" ]; then
            echo "Expected release APK not found: release-apk/${RELEASE_APK}" >&2
            find release-apk -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi

          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "${{ inputs.tag }}" != "$EXPECTED_TAG" ]; then
            echo "Release tag must be $EXPECTED_TAG for this APK, got ${{ inputs.tag }}." >&2
            exit 1
          fi

          SHA256="$(sha256sum "release-apk/${RELEASE_APK}" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$RELEASE_APK" > "release-apk/${RELEASE_APK}.sha256"

          cat > release-notes.md <<EOF
          ## ViRouteFS ${VERSION_NAME}

          - versionName: ${VERSION_NAME}
          - versionCode: ${VERSION_CODE}
          - SHA-256: \`${SHA256}\`

          This is a manually approved, consistently signed beta build from the tagged source.

          Beta update behavior:
          - The app supports manual update checking from Settings.
          - APK download starts only after the user taps Download APK.
          - Install update opens Android's system package installer.
          - No background checks.
          - No auto-download.
          - No silent install.
          - Android / Play Protect may show sideload warnings outside Google Play; ViRouteFS cannot suppress system install warnings.

          If an older APK used a different signing key, Android requires uninstalling it once before this new signing line can be installed.
          EOF

          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "RELEASE_APK=${RELEASE_APK}"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            "$RELEASE_TAG"
            "release-apk/$RELEASE_APK"
            "release-apk/$RELEASE_APK.sha256"
            --title "$RELEASE_NAME"
            --notes-file release-notes.md
            --target "$GITHUB_SHA"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Release tag points to $TAG_SHA instead of the built commit $GITHUB_SHA." >&2
            exit 1
          fi

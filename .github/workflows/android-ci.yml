name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.6.9-alpha'
        required: true
        type: string
      release_name:
        description: 'Release title, for example ViRouteFS 0.6.9-alpha'
        required: true
        type: string
      prerelease:
        description: 'Mark this GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare optional alpha signing key
        env:
          VIROUTEFS_ALPHA_KEYSTORE_BASE64: ${{ secrets.VIROUTEFS_ALPHA_KEYSTORE_BASE64 }}
          VIROUTEFS_ALPHA_KEYSTORE_PASSWORD: ${{ secrets.VIROUTEFS_ALPHA_KEYSTORE_PASSWORD }}
          VIROUTEFS_ALPHA_KEY_ALIAS: ${{ secrets.VIROUTEFS_ALPHA_KEY_ALIAS }}
          VIROUTEFS_ALPHA_KEY_PASSWORD: ${{ secrets.VIROUTEFS_ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${VIROUTEFS_ALPHA_KEYSTORE_BASE64:-}" ]; then
            ALPHA_KEYSTORE_PATH="$RUNNER_TEMP/viroutefs-alpha.jks"
            printf '%s' "$VIROUTEFS_ALPHA_KEYSTORE_BASE64" | base64 --decode > "$ALPHA_KEYSTORE_PATH"
            {
              echo "VIROUTEFS_ALPHA_KEYSTORE_PATH=$ALPHA_KEYSTORE_PATH"
              echo "VIROUTEFS_ALPHA_KEYSTORE_PASSWORD=$VIROUTEFS_ALPHA_KEYSTORE_PASSWORD"
              echo "VIROUTEFS_ALPHA_KEY_ALIAS=$VIROUTEFS_ALPHA_KEY_ALIAS"
              echo "VIROUTEFS_ALPHA_KEY_PASSWORD=$VIROUTEFS_ALPHA_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Alpha signing key decoded into RUNNER_TEMP."
          else
            echo "VIROUTEFS_ALPHA_KEYSTORE_BASE64 is not configured; building with default debug signing."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          set -euo pipefail

          VERSION_NAME="$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/ { print $2; exit }' app/build.gradle.kts)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to detect versionName from app/build.gradle.kts." >&2
            exit 1
          fi

          mapfile -t DEBUG_APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#DEBUG_APKS[@]}" -eq 0 ]; then
            echo "No debug APK found under app/build/outputs/apk/debug/*.apk." >&2
            echo "Debug APK output directory contents:" >&2
            find app/build/outputs/apk/debug -maxdepth 2 -print >&2 || true
            exit 1
          fi

          SELECTED_APK="${DEBUG_APKS[0]}"
          ARTIFACT_NAME="ViRouteFS-debug-${VERSION_NAME}"
          ARTIFACT_APK="${ARTIFACT_NAME}.apk"
          RELEASE_APK="ViRouteFS-${VERSION_NAME}.apk"

          echo "Detected VERSION_NAME: ${VERSION_NAME}"
          echo "Selected APK path: ${SELECTED_APK}"
          echo "CI artifact filename: ${ARTIFACT_APK}"
          echo "Release asset filename: ${RELEASE_APK}"

          cp "$SELECTED_APK" "$ARTIFACT_APK"
          cp "$SELECTED_APK" "$RELEASE_APK"
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            echo "ARTIFACT_APK=${ARTIFACT_APK}"
            echo "RELEASE_APK=${RELEASE_APK}"
          } >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_APK }}
          if-no-files-found: error

      - name: Upload release APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ViRouteFS-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ViRouteFS-release-apk
          path: release-apk

      - name: Prepare release notes
        run: |
          set -euo pipefail

          VERSION_NAME="$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/ { print $2; exit }' app/build.gradle.kts)"
          VERSION_CODE="$(awk '/^[[:space:]]*versionCode[[:space:]]*=/ { print $3; exit }' app/build.gradle.kts)"
          RELEASE_APK="ViRouteFS-${VERSION_NAME}.apk"

          if [ ! -f "release-apk/${RELEASE_APK}" ]; then
            echo "Expected release APK not found: release-apk/${RELEASE_APK}" >&2
            find release-apk -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi

          cat > release-notes.md <<EOF
          ## ViRouteFS ${VERSION_NAME}

          versionCode ${VERSION_CODE}

          This alpha APK is published through GitHub Releases as the user-facing download channel.

          Highlights:
          - GitHub Releases APK distribution.
          - Manual in-app update checking aligned with published GitHub Releases.
          - Minimalist black/red launcher icon refresh with adaptive, round, themed, and legacy-compatible resources.

          Notes:
          - Manual update checks only; the app does not auto-download or auto-install APKs.
          - No runtime VPN engine, packet forwarding, default route, telemetry, analytics, ads, tracking, or cloud upload is added by this release path.
          - If you installed an older randomly-signed debug APK, Android may require one uninstall before installing stable alpha-signed builds.
          EOF

          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "RELEASE_APK=${RELEASE_APK}"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=("$RELEASE_TAG" "release-apk/$RELEASE_APK" --title "$RELEASE_NAME" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
